# Supabase (offre gratuite) met en pause un projet sans activité pendant 7 jours.
# Cette tâche lit un club chaque jour pour garder la base active. Elle n'utilise que la clé publique (lecture seule).
name: Garder Supabase actif

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours à 6h17 (UTC)
  workflow_dispatch:        # bouton « Run workflow » pour la lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire un club dans la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://aogcjrfrfdasxesntlpk.supabase.co/rest/v1/clubs?select=id&limit=1" \
            -H "apikey: sb_publishable_ZNohzowK1cNBG_-qukzemQ_KAG9EX-Z")
          echo "Réponse de Supabase : $code"
          test "$code" = "200"
